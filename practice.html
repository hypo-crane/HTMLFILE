<!DOCTYPE html>
<html>
<head>
    <title>My Courses</title>

    <style>

        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e8e8f5;
            text-align: center;
        }

        
        h1 {
            margin-top: 40px;
            color: #333333;
        }

        
        .courses {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
        }

        
        .card {
            width: 220px;
            padding: 25px;
            background-color: #ffeaf2;
            border: 1px solid #d8c8d0;
            border-radius: 10px;

            box-shadow: 0px 4px 10px #999999;
        }

       
        .card h2 {
            color: #333333;
        }

        
        .card p {
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
        }

        
        .card button {
            width: 100%;
            padding: 12px;

            background-color: #4169e1;
            color: white;

            border: none;
            border-radius: 5px;

            font-size: 15px;
            cursor: pointer;
        }

        
        .card button:hover {
            background-color: #2748b5;
        }

        
        #message {
            margin-top: 40px;
            color: #666666;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <h1>MY COURSES</h1>

    <div class="courses">

        <!-- HTML -->
        <div class="card">
            <h2>HTML</h2>

            <p>
                Learn the basics of HTML and
                create your first webpage.
            </p>

            <button onclick="startCourse('HTML')">
                Start Course
            </button>
        </div>


        <!-- CSS -->
        <div class="card">
            <h2>CSS</h2>

            <p>
                Learn colors, fonts, layouts and
                beautiful webpage designs.
            </p>

            <button onclick="startCourse('CSS')">
                Start Course
            </button>
        </div>


        <!-- JavaScript -->
        <div class="card">
            <h2>JavaScript</h2>

            <p>
                Learn JavaScript and make your
                webpages interactive.
            </p>

            <button onclick="startCourse('JavaScript')">
                Start Course
            </button>
        </div>

    </div>


    <p id="message">
        Learn Web Development.
    </p>


    <script>

        function startCourse(courseName) {

            document.getElementById("message").innerHTML =
                "You selected the " + courseName + " course!";

        }

    </script>

</body>
</html>
