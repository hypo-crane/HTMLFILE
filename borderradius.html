<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple card</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            background-color:lightpink;
            border:10px solid black;
            border-radius: 30px;
        }
        .card h2 {
            color: darkgreen;
            text-align: center;
        }
        .card p {
            color: saddlebrown;
            font-size: 16px;
        text-align: center;        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Web Development</h2>
        <p>Learn HTML and CSS to create beautiful webpages.</p>
    </div>
    
</body>
</html>
